<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VibeFind | Admin Dashboard</title>
<style>
* {box-sizing:border-box}
body {
  background:#faf7f1;
  color:#302b27;
  font-family:Arial,sans-serif;
  margin:0;
}
main {max-width:650px;margin:45px auto;padding:18px}
h1,h2 {font-family:Georgia,serif;color:#604b3d}
.card {
  background:white;
  border:1px solid #e6ddd1;
  border-radius:14px;
  padding:28px;
  margin-bottom:20px;
}
label {
  display:block;
  font-weight:bold;
  font-size:13px;
  margin:15px 0 7px;
}
input,select,textarea {
  width:100%;
  padding:13px;
  border:1px solid #d9cfc2;
  border-radius:6px;
  font:inherit;
}
textarea {min-height:100px}
button {
  margin-top:18px;
  border:0;
  padding:13px 22px;
  background:#604b3d;
  color:white;
  border-radius:6px;
  cursor:pointer;
}
button:disabled {opacity:.6}
.hidden {display:none}
.status {margin-top:15px;line-height:1.6}
.note {font-size:13px;color:#75695f}
</style>
</head>
<body>

<main>
  <h1>VibeFind.</h1>
  <p class="note">Private Product Management Dashboard</p>

  <section id="loginBox" class="card">
    <h2>Admin Login</h2>
    <form id="loginForm">
      <label>Email</label>
      <input id="email" type="email" required>

      <label>Password</label>
      <input id="password" type="password" required>

      <button id="loginBtn" type="submit">Login</button>
    </form>
    <p id="loginStatus" class="status" role="status"></p>
  </section>

  <section id="adminBox" class="card hidden">
    <h2>Add New Product</h2>
    <p id="welcome" class="note"></p>

    <form id="productForm">
      <label>Product Name</label>
      <input id="name" required maxlength="180">

      <label>Category</label>
      <select id="category">
        <option value="Fashion">Fall Fashion</option>
        <option value="Home">Cozy Home</option>
        <option value="Kitchen">Kitchen & Coffee</option>
        <option value="Beauty">Beauty Finds</option>
      </select>

      <label>Description</label>
      <textarea id="description" maxlength="600"></textarea>

      <label>Permitted Product Image URL</label>
      <input id="image" type="url" placeholder="https://...">

      <label>Affiliate Link</label>
      <input id="affiliate" type="url" required
        placeholder="https://...">

      <button id="saveBtn" type="submit">Add Product</button>
      <button type="button" id="logoutBtn">Logout</button>
    </form>

    <p id="productStatus" class="status" role="status"></p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
  "https://heshxrukrkcsgpdjhzhe.supabase.co";

const SUPABASE_KEY =
  "Psb_publishable_SNzkZDVCh3xTDGRTXR2_TA_hkrzX-7Q";

const loginBox = document.getElementById("loginBox");
const adminBox = document.getElementById("adminBox");
const loginStatus = document.getElementById("loginStatus");
const productStatus = document.getElementById("productStatus");

let db;

async function startApp() {
  try {
    if (!window.supabase) {
      throw new Error("Supabase library did not load.");
    }

    if (SUPABASE_KEY.includes("PASTE_YOUR")) {
      throw new Error("Publishable key is missing.");
    }

    db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    await checkAdmin();
  } catch (error) {
    loginStatus.textContent = error.message;
  }
}

async function checkAdmin() {
  const { data, error } = await db.auth.getUser();

  if (error || !data.user) {
    loginBox.classList.remove("hidden");
    adminBox.classList.add("hidden");
    return;
  }

  const result = await db
    .from("admin_users")
    .select("user_id")
    .eq("user_id", data.user.id)
    .maybeSingle();

  if (result.error || !result.data) {
    loginStatus.textContent =
      "Account is not authorized as admin.";
    await db.auth.signOut();
    return;
  }

  loginBox.classList.add("hidden");
  adminBox.classList.remove("hidden");

  document.getElementById("welcome").textContent =
    "Signed in as " + data.user.email;
}

document.getElementById("loginForm")
.addEventListener("submit", async (event) => {
  event.preventDefault();

  if (!db) {
    loginStatus.textContent =
      "Supabase connection is not ready.";
    return;
  }

  const button = document.getElementById("loginBtn");
  button.disabled = true;
  loginStatus.textContent = "Signing in...";

  try {
    const { error } = await db.auth.signInWithPassword({
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value
    });

    if (error) throw error;

    document.getElementById("password").value = "";
    await checkAdmin();

  } catch (error) {
    loginStatus.textContent = error.message;
  } finally {
    button.disabled = false;
  }
});

document.getElementById("productForm")
.addEventListener("submit", async (event) => {
  event.preventDefault();

  const button = document.getElementById("saveBtn");
  button.disabled = true;
  productStatus.textContent = "Saving...";

  const name = document.getElementById("name").value.trim();
  const category = document.getElementById("category").value;
  const description =
    document.getElementById("description").value.trim();
  const image =
    document.getElementById("image").value.trim();
  const affiliate =
    document.getElementById("affiliate").value.trim();

  try {
    const validHttps = (value) =>
      new URL(value).protocol === "https:";

    if (!validHttps(affiliate) ||
        (image && !validHttps(image))) {
      throw new Error("Use valid HTTPS links.");
    }

    const { error } = await db.from("products").insert({
      name,
      category,
      description,
      image_url: image || null,
      affiliate_link: affiliate
    });

    if (error) throw error;

    productStatus.textContent = "Product saved successfully!";
    document.getElementById("productForm").reset();

  } catch (error) {
    productStatus.textContent = error.message;
  } finally {
    button.disabled = false;
  }
});

document.getElementById("logoutBtn")
.addEventListener("click", async () => {
  await db.auth.signOut();
  adminBox.classList.add("hidden");
  loginBox.classList.remove("hidden");
});

startApp();
</script>

</body>
</html>
