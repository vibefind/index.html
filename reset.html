<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VibeFind | Reset Password</title>
<style>
  body {
    background:#faf7f1;
    color:#302b27;
    font-family:Arial,sans-serif;
    margin:0;
  }
  main {
    max-width:430px;
    margin:65px auto;
    padding:25px;
  }
  h1 {
    font-family:Georgia,serif;
    color:#604b3d;
  }
  .card {
    padding:25px;
    background:white;
    border:1px solid #e8ded2;
    border-radius:12px;
  }
  input,button {
    width:100%;
    padding:13px;
    margin:8px 0;
    border-radius:6px;
    box-sizing:border-box;
    font-size:15px;
  }
  input {border:1px solid #d9cfc2}
  button {
    border:0;
    background:#604b3d;
    color:white;
    cursor:pointer;
  }
  button:disabled {opacity:.6}
  .hidden {display:none}
  #message {line-height:1.6}
</style>
</head>
<body>
<main>
  <h1>VibeFind.</h1>
  <div class="card">
    <h2>Reset Admin Password</h2>

    <form id="requestForm">
      <p>Enter your admin email to receive a reset link.</p>
      <input id="email" type="email"
        placeholder="Admin email" required>
      <button type="submit">Send Reset Email</button>
    </form>

    <form id="changeForm" class="hidden">
      <p>Choose your new admin password.</p>
      <input id="newPassword" type="password"
        placeholder="New password"
        minlength="12" required>
      <input id="confirmPassword" type="password"
        placeholder="Confirm new password"
        minlength="12" required>
      <button type="submit">Save New Password</button>
    </form>

    <p id="message" role="status"></p>
  </div>
const SUPABASE_URL = "https://heshxrukrkcsgpdjhzhe.supabase.co";
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://heshxrukrkcsgpdjhzhe.supabase.co";
const SUPABASE_KEY = "sb_publishable_SNzkZDVCh3xTDGRTXR2_TA_hkrzX-7Q";
const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY 
);
const resetUrl =
  "https://vibefind.github.io/index.html/reset.html";
const message = document.getElementById("message");
const requestForm = document.getElementById("requestForm");
const changeForm = document.getElementById("changeForm");
client.auth.onAuthStateChange((event) => {
  if (event === "PASSWORD_RECOVERY") {
    requestForm.classList.add("hidden");
    changeForm.classList.remove("hidden");
    message.textContent = "You can now set a new password.";
  }
});
requestForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const button = requestForm.querySelector("button");
  button.disabled = true;
  message.textContent = "Sending reset email...";
 const email = document.getElementById("email").value.trim();
  const { error } = await client.auth.resetPasswordForEmail(
    email,
    { redirectTo: resetUrl }
  );
button.disabled = false;
  message.textContent = error
    ? error.message
    : "If the account exists, a reset email will be sent. Check your inbox.";
});
changeForm.addEventListener("submit", async (e) => {
  e.preventDefault();
const password =
    document.getElementById("newPassword").value;
  const confirm =
    document.getElementById("confirmPassword").value;
if (password !== confirm) {
    message.textContent = "Passwords do not match.";
    return;
  }
 const button = changeForm.querySelector("button");
  button.disabled = true;
  message.textContent = "Updating password...";
 const { error } = await client.auth.updateUser({
    password: password
  });
  button.disabled = false;
if (error) {
    message.textContent = error.message;
    return;
  }
await client.auth.signOut();
  changeForm.classList.add("hidden");
  message.textContent =
    "Password updated! Open the VibeFind Admin Login page.";
});
</script>
</body>
</html>
